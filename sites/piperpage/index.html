<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Piper Page</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 50px 15px;
      background: #6a0dad;
      color: #ff9900;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    .page {
      width: 520px;
      max-width: 90%;
      margin: 0 auto;
      padding: 28px 18px;
      border: 3px solid #ff9900;
      background: #4b087d;
      color: #ff9900;
    }
    h1 {
      margin: 0 0 24px 0;
      color: #ff9900;
      font-size: 36px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      color: #ff9900;
    }
    td {
      padding: 12px 8px;
      border-top: 1px solid #ff9900;
      color: #ff9900;
      font-size: 18px;
      text-align: left;
    }
    .label {
      width: 48%;
      font-weight: bold;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Piper Page</h1>
    <table summary="Facts about Piper">
      <tr>
        <td class="label">Family:</td>
        <td>Sister of Grayson</td>
      </tr>
      <tr>
        <td class="label">Favorite game:</td>
        <td>Roblox</td>
      </tr>
      <tr>
        <td class="label">Favorite game on Roblox:</td>
        <td>Murder Mystery 2</td>
      </tr>
      <tr>
        <td class="label">Favorite animal:</td>
        <td>Rabbit</td>
      </tr>
      <tr>
        <td class="label">Favorite color:</td>
        <td>Orange</td>
      </tr>
      <tr>
        <td class="label">Favorite activity:</td>
        <td>Drawing</td>
      </tr>
    </table>
  </div>
</body>
</html>
