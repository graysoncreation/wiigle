<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="description" content="WiiKit - open packs and collect blooks on Nintendo Wii">
  <title>WiiKit</title>
  <style type="text/css">
    html, body { margin: 0; padding: 0; }
    body {
      background: #dff4ff;
      color: #18324a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      text-align: center;
    }
    .top {
      padding: 13px 4%;
      background: #287fc0;
      color: #ffffff;
      border-bottom: 4px solid #17649e;
      text-align: left;
    }
    .top strong { font-size: 28px; }
    .top span { margin-left: 12px; font-size: 13px; }
    .page { width: 90%; max-width: 850px; margin: 22px auto; }
    .panel {
      margin-bottom: 18px;
      padding: 18px;
      background: #ffffff;
      border: 2px solid #8cc7e8;
    }
    h1, h2 { margin-top: 0; }
    h1 { color: #287fc0; font-size: 42px; }
    h2 { color: #245979; font-size: 23px; }
    select {
      width: 55%;
      min-width: 260px;
      padding: 9px;
      border: 2px solid #70b5df;
      background: #ffffff;
      color: #18324a;
      font-size: 18px;
    }
    .open-button, .small-button {
      padding: 10px 22px;
      border: 2px solid #175f92;
      background: #287fc0;
      color: #ffffff;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }
    .open-button { margin-left: 6px; }
    .small-button {
      padding: 6px 12px;
      background: #eeeeee;
      color: #174968;
      font-size: 14px;
    }
    #pack-info { margin: 12px 0; color: #56778b; }
    #result {
      display: none;
      width: 72%;
      min-height: 155px;
      margin: 18px auto 0 auto;
      padding: 22px;
      border: 5px solid #9aa9b2;
      background: #f6fbff;
    }
    #result.opening { display: block; }
    #rarity {
      margin-bottom: 7px;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
    }
    #blook-name { margin: 12px 0; font-size: 34px; color: #173c57; }
    #new-label { color: #d26a00; font-weight: bold; }
    .Uncommon { color: #2c9b42; }
    .Rare { color: #287fc0; }
    .Epic { color: #8847c9; }
    .Legendary { color: #e58b00; }
    .Chroma { color: #e13f92; }
    #collection { text-align: left; }
    .collection-row {
      padding: 7px;
      border-bottom: 1px solid #d7e6ee;
    }
    .count { float: right; font-weight: bold; }
    .empty { text-align: center; color: #788c98; }
    .stats { margin-bottom: 14px; font-weight: bold; }
    .footer { padding: 18px 0 30px 0; color: #68879a; font-size: 12px; }
  </style>
</head>
<body onload="s=document.createElement('script');s.type='text/javascript';s.src='game.js';document.getElementsByTagName('head')[0].appendChild(s)">
  <div class="top"><strong>WiiKit</strong><span>Pack Opening Collection</span></div>
  <div class="page">
    <div class="panel">
      <h1>Open a Pack!</h1>
      <p>Choose a pack, open it, and collect every blook.</p>
      <div>
        <select id="pack-select" onchange="showPackInfo()"></select>
        <input class="open-button" type="button" value="Open Pack" onclick="openPack()">
      </div>
      <div id="pack-info">Loading packs...</div>
      <div id="result">
        <div id="rarity"></div>
        <div id="blook-name">Opening...</div>
        <div id="new-label"></div>
      </div>
    </div>

    <div class="panel">
      <h2>My Collection</h2>
      <div class="stats">
        Packs opened: <span id="opened-count">0</span>
        &nbsp; | &nbsp;
        Unique blooks: <span id="unique-count">0</span> / <span id="total-count">0</span>
      </div>
      <p>
        <select id="collection-filter" onchange="drawCollection()"></select>
        <input class="small-button" type="button" value="Clear Collection" onclick="clearCollection()">
      </p>
      <div id="collection"><p class="empty">Open a pack to begin your collection.</p></div>
    </div>
    <div class="footer">WiiKit saves your collection in this browser.</div>
  </div>
</body>
</html>
