<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Wii Clicker</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 28px 10px;
      background: #eaf8ff;
      color: #164b67;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    .game {
      width: 560px;
      max-width: 92%;
      margin: 0 auto;
      padding: 24px;
      border: 3px solid #58b9df;
      background: #ffffff;
    }
    h1 {
      margin: 0 0 10px 0;
      color: #28a7d8;
      font-size: 36px;
    }
    .money {
      margin: 12px 0;
      color: #18824b;
      font-size: 30px;
      font-weight: bold;
    }
    .power {
      margin-bottom: 18px;
      font-size: 18px;
    }
    .logo-button {
      padding: 12px;
      border: 3px solid #58b9df;
      background: #f5fcff;
      cursor: pointer;
    }
    .logo-button:hover {
      background: #dff6ff;
    }
    .logo-button img {
      width: 240px;
      max-width: 80%;
      border: 0;
    }
    .main-button, .upgrade-button {
      padding: 12px 18px;
      border: 2px solid #238db7;
      background: #35b6e7;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }
    .main-button {
      margin-top: 20px;
    }
    #upgrades {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border: 2px solid #58b9df;
      background: #eaf8ff;
    }
    #upgrades h2 {
      margin: 0 0 12px 0;
      color: #238db7;
    }
    table {
      width: 100%;
      border-spacing: 7px;
    }
    td {
      width: 50%;
      font-size: 17px;
    }
    .upgrade-button {
      width: 100%;
    }
    .message {
      min-height: 24px;
      margin: 12px 0 0 0;
      color: #a34c00;
      font-weight: bold;
    }
    .help {
      margin: 16px 0 0 0;
      color: #557887;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>Wii Clicker</h1>
    <div class="money">$<span id="money">0</span></div>
    <div class="power">Each click earns $<span id="power">1</span></div>

    <input id="moneyValue" type="hidden" value="0">
    <input id="powerValue" type="hidden" value="1">

    <button class="logo-button" type="button"
      onclick="var m=document.getElementById('moneyValue');var p=document.getElementById('powerValue');m.value=parseInt(m.value,10)+parseInt(p.value,10);document.getElementById('money').innerHTML=m.value;document.getElementById('message').innerHTML='You earned $'+p.value+'!';">
      <img src="WiiLogo.png" alt="Click the Wii logo">
    </button>

    <br>
    <button class="main-button" type="button"
      onclick="var u=document.getElementById('upgrades');u.style.display=u.style.display=='block'?'none':'block';">
      Upgrades
    </button>

    <div id="upgrades">
      <h2>Upgrade Shop</h2>
      <table summary="Wii Clicker upgrades">
        <tr>
          <td>2x Power — $25</td>
          <td><button class="upgrade-button" type="button"
            onclick="var m=document.getElementById('moneyValue');var p=document.getElementById('powerValue');if(parseInt(p.value,10)>=2){document.getElementById('message').innerHTML='You already own this upgrade!';}else if(parseInt(m.value,10)>=25){m.value=parseInt(m.value,10)-25;p.value=2;document.getElementById('money').innerHTML=m.value;document.getElementById('power').innerHTML=p.value;document.getElementById('message').innerHTML='2x Power purchased!';}else{document.getElementById('message').innerHTML='You need $25!';}">Buy 2x</button></td>
        </tr>
        <tr>
          <td>4x Power — $100</td>
          <td><button class="upgrade-button" type="button"
            onclick="var m=document.getElementById('moneyValue');var p=document.getElementById('powerValue');if(parseInt(p.value,10)>=4){document.getElementById('message').innerHTML='You already own this upgrade!';}else if(parseInt(p.value,10)<2){document.getElementById('message').innerHTML='Buy 2x Power first!';}else if(parseInt(m.value,10)>=100){m.value=parseInt(m.value,10)-100;p.value=4;document.getElementById('money').innerHTML=m.value;document.getElementById('power').innerHTML=p.value;document.getElementById('message').innerHTML='4x Power purchased!';}else{document.getElementById('message').innerHTML='You need $100!';}">Buy 4x</button></td>
        </tr>
        <tr>
          <td>8x Power — $400</td>
          <td><button class="upgrade-button" type="button"
            onclick="var m=document.getElementById('moneyValue');var p=document.getElementById('powerValue');if(parseInt(p.value,10)>=8){document.getElementById('message').innerHTML='You already own this upgrade!';}else if(parseInt(p.value,10)<4){document.getElementById('message').innerHTML='Buy 4x Power first!';}else if(parseInt(m.value,10)>=400){m.value=parseInt(m.value,10)-400;p.value=8;document.getElementById('money').innerHTML=m.value;document.getElementById('power').innerHTML=p.value;document.getElementById('message').innerHTML='8x Power purchased!';}else{document.getElementById('message').innerHTML='You need $400!';}">Buy 8x</button></td>
        </tr>
        <tr>
          <td>16x Power — $1,600</td>
          <td><button class="upgrade-button" type="button"
            onclick="var m=document.getElementById('moneyValue');var p=document.getElementById('powerValue');if(parseInt(p.value,10)>=16){document.getElementById('message').innerHTML='You already own this upgrade!';}else if(parseInt(p.value,10)<8){document.getElementById('message').innerHTML='Buy 8x Power first!';}else if(parseInt(m.value,10)>=1600){m.value=parseInt(m.value,10)-1600;p.value=16;document.getElementById('money').innerHTML=m.value;document.getElementById('power').innerHTML=p.value;document.getElementById('message').innerHTML='16x Power purchased!';}else{document.getElementById('message').innerHTML='You need $1,600!';}">Buy 16x</button></td>
        </tr>
        <tr>
          <td>32x Power — $6,400</td>
          <td><button class="upgrade-button" type="button"
            onclick="var m=document.getElementById('moneyValue');var p=document.getElementById('powerValue');if(parseInt(p.value,10)>=32){document.getElementById('message').innerHTML='You already own this upgrade!';}else if(parseInt(p.value,10)<16){document.getElementById('message').innerHTML='Buy 16x Power first!';}else if(parseInt(m.value,10)>=6400){m.value=parseInt(m.value,10)-6400;p.value=32;document.getElementById('money').innerHTML=m.value;document.getElementById('power').innerHTML=p.value;document.getElementById('message').innerHTML='32x Power purchased!';}else{document.getElementById('message').innerHTML='You need $6,400!';}">Buy 32x</button></td>
        </tr>
      </table>
    </div>

    <div id="message" class="message">Click the Wii logo to earn money!</div>
    <p class="help">Upload WiiLogo.png beside this index.html file in Wiithub Studio.</p>
  </div>
</body>
</html>
