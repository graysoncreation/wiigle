openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: wiithub
    description: Wiithub static site publishing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /wiithub/sites/{id}:
    get:
      operationId: getWiithubSite
      tags: [wiithub]
      summary: Get a published site's metadata
      parameters:
        - $ref: "#/components/parameters/WiithubSiteId"
      responses:
        "200":
          description: Published site metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WiithubSite"
        "404":
          description: Site ID not found
  /wiithub/sites:
    post:
      operationId: publishWiithubSite
      tags: [wiithub]
      summary: Publish a static site under a unique ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WiithubPublishInput"
      responses:
        "201":
          description: Site published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WiithubSite"
        "400":
          description: Invalid site or files
        "409":
          description: Site ID already exists
components:
  parameters:
    WiithubSiteId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{2,31}$"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WiithubSite:
      type: object
      required: [id, fileCount, totalBytes, createdAt, runUrl]
      properties:
        id:
          type: string
        fileCount:
          type: number
        totalBytes:
          type: number
        createdAt:
          type: string
          format: date-time
        runUrl:
          type: string
    WiithubFileInput:
      type: object
      required: [path, contentBase64, contentType, size]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 180
        contentBase64:
          type: string
          minLength: 1
        contentType:
          type: string
          maxLength: 100
        size:
          type: number
          minimum: 0
          maximum: 524288
    WiithubPublishInput:
      type: object
      required: [id, files]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{2,31}$"
        files:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: "#/components/schemas/WiithubFileInput"

